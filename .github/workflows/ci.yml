name: Full CI/CD Pipeline (Docker Ready)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo
        ports:
          - 27017:27017

      redis:
        image: redis
        ports:
          - 6379:6379

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Setup Docker Buildx (important for pro builds)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Build Docker image (MAIN STEP)
      - name: Build Docker image
        run: |
          docker build -t legal-hybrid-rag .

      # 4. Run container (basic test)
      - name: Run container test
        run: |
          docker run -d -p 8000:8000 --name test-container legal-hybrid-rag
          sleep 10

      # 5. Check container logs (debugging)
      - name: Check container logs
        run: |
          docker logs test-container

      # 6. Stop container
      - name: Stop container
        run: |
          docker stop test-container

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Deployment placeholder
        run: echo "Ready to deploy Docker image to cloud (Render / AWS / Railway)"